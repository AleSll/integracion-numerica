<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Integración numérica · La Paz</title>
<style>
:root{box-sizing:border-box;--bg:#faf7f2;--fg:#1d1b18;--mu:#6b655c;--card:#fff;--bd:#e3dccf;--ac:#b4472a;--ac2:#2a6f6b;--ok:#2a7a3b;--er:#b3261e;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171513;--fg:#f0ebe3;--mu:#a39b8f;--card:#211e1b;--bd:#3a352f;--ac:#e8836a;--ac2:#6cc2bc;--ok:#7fd18f;--er:#ff8a80}}
:root[data-theme="dark"]{--bg:#171513;--fg:#f0ebe3;--mu:#a39b8f;--card:#211e1b;--bd:#3a352f;--ac:#e8836a;--ac2:#6cc2bc;--ok:#7fd18f;--er:#ff8a80}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:980px;margin:0 auto;padding:16px}h1{font:700 24px/1.2 Georgia,serif;margin:4px 0}h2{font:600 18px Georgia,serif;margin:0 0 6px}.sub{color:var(--mu);margin:0 0 12px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px}.tabs button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:20px;padding:6px 14px;cursor:pointer;font:600 14px inherit}.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:10px 0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.row>label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:3px}
input,select,textarea{font:14px ui-monospace,Menlo,monospace;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:7px 9px;max-width:100%}textarea{width:100%;min-height:130px}
.btn{background:var(--ac2);color:#fff;border:0;border-radius:8px;padding:9px 16px;font:600 14px system-ui;cursor:pointer}.btn.g{background:transparent;color:var(--fg);border:1px solid var(--bd)}
.big{font:700 26px ui-monospace,Menlo,monospace;color:var(--ac)}.mu{color:var(--mu);font-size:13px}.err{color:var(--er);font-weight:600}.ok{color:var(--ok);font-weight:600}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font:13px ui-monospace,Menlo,monospace}th,td{border-bottom:1px solid var(--bd);padding:5px 8px;text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}th{color:var(--mu);font-weight:600}

</style></head><body><main>
<h1>Integración numérica aplicada · La Paz, Bolivia</h1><p class="sub">Trapecio compuesto, Simpson 1/3 y Simpson 3/8 · Ejercicios 19–27 · Métodos Numéricos</p>
<div class="tabs" id="tabs"></div>
<div class="card"><h2 id="ttl"></h2><p class="mu" id="txt"></p>
<div id="inp"></div>
<div class="row" style="margin-top:10px"><label>Método<select id="met"><option value="trap">Trapecio compuesto</option><option value="s13">Simpson 1/3 (n par)</option><option value="s38">Simpson 3/8 (n múltiplo de 3)</option><option value="comb" selected>Simpson combinado (1/3 + 3/8)</option><option value="s13t">Simpson 1/3 + trapecio final</option></select></label>
<label id="vl">Magnitud<select id="var"></select></label><label>Valor de referencia (opcional)<input id="ref" size="14"></label><button class="btn" id="go">Calcular</button><button class="btn g" id="tst">Prueba x²</button></div>
<p id="msg" style="margin:8px 0 0"></p></div>
<div id="out"></div>
<p class="mu">Los datos de curvas digitalizadas (ej. 21 y 26) son estimaciones editables. Los escenarios de La Paz son adaptaciones didácticas.</p>
</main><script>
const PI=Math.PI;
function mkFn(s){const names=Object.getOwnPropertyNames(Math);const body='"use strict";const {'+names.join(',')+'}=Math;return ('+s.replace(/\^/g,'**')+');';return new Function('x','t','r','y',body);}
function coefs(method,n){ // coeficientes de f_i en unidades de h
  const c=new Array(n+1).fill(0);
  const s13=(a,b)=>{for(let i=a;i<=b;i++){const k=i-a;c[i]+=(i===a||i===b)?1/3:(k%2?4/3:2/3);}};
  const s38=(a,b)=>{for(let i=a;i<=b;i++){const k=i-a;c[i]+=(i===a||i===b)?3/8:(k%3?9/8:6/8);}};
  if(method==='trap'){for(let i=0;i<=n;i++)c[i]=(i===0||i===n)?.5:1;}
  else if(method==='s13'){if(n%2||n<2)return null;s13(0,n);}
  else if(method==='s38'){if(n%3||n<3)return null;s38(0,n);}
  else if(method==='s13t'){if(n<3||n%2===0)return null;s13(0,n-1);c[n-1]+=.5;c[n]+=.5;}
  else if(method==='comb'){if(n<2)return null;if(n%2===0)s13(0,n);else{if(n<3)return null;if(n===3)s38(0,3);else{s13(0,n-3);s38(n-3,n);}}}
  return c;}
function integrate(ys,h,method){const c=coefs(method,ys.length-1);if(!c)return null;let s=0;for(let i=0;i<ys.length;i++)s+=c[i]*ys[i];return s*h;}
function parseTable(txt){const rows=txt.split(/\n|;/).map(l=>l.trim()).filter(Boolean);const xs=[],ys=[];
  for(const [i,l] of rows.entries()){const p=l.split(/[\s,;\t]+/).filter(Boolean);
   if(p.length!==2)throw new Error('Línea '+(i+1)+': se esperan exactamente 2 valores (x,y). Listas desiguales o formato incorrecto.');
   const a=Number(p[0]),b=Number(p[1]);if(!isFinite(a)||!isFinite(b))throw new Error('Línea '+(i+1)+': dato no numérico.');xs.push(a);ys.push(b);}
  if(xs.length<2)throw new Error('Se necesitan al menos 2 puntos.');
  for(let i=1;i<xs.length;i++)if(!(xs[i]>xs[i-1]))throw new Error('x debe ser estrictamente creciente (revisar fila '+(i+1)+').');
  const h=(xs[xs.length-1]-xs[0])/(xs.length-1);
  for(let i=1;i<xs.length;i++)if(Math.abs((xs[i]-xs[i-1])-h)>1e-9*Math.max(1,Math.abs(h)))throw new Error('Espaciamiento no uniforme en fila '+(i+1)+': los métodos requieren h constante.');
  return {xs,ys,h};}
function ddx(r,h){return r.map((_,i)=>i===0?(r[1]-r[0])/h:i===r.length-1?(r[i]-r[i-1])/h:(r[i+1]-r[i-1])/(2*h));}
const R=6371000,g0=9.81;
const EX={
19:{t:'Transporte urbano · distancia de un vehículo',kind:'table',x:'t (s)',y:'v (mi/h)',d:'0,0\n1,14\n2,39\n3,69\n4,95\n5,114\n6,129\n7,139',
 txt:'d = ∫₀⁷ v(t) dt (v en mi/h, t en s; se divide entre 3600 para obtener millas)',v:[{n:'Distancia',u:'mi/h·s',p:I=>[[I/3600,'mi'],[I/3600*1609.344,'m']]}]},
20:{t:'Ensayo de elasticidad · trabajo de la banda',kind:'table',x:'x (in)',y:'F (lb)',d:'0,0\n0.4,0.85\n0.8,1.3\n1.2,1.6\n1.6,1.87\n2.0,2.14\n2.4,2.34\n2.8,2.52',
 txt:'W = ∫₀²·⁸ F(x) dx',v:[{n:'Trabajo',u:'lb·in',p:I=>[[I,'lb·in'],[I*0.1129848,'J']]}]},
21:{t:'Perfil topográfico · área bajo el perfil',kind:'table',x:'x',y:'y',d:'1,1.3\n2,3.7\n3,4.6\n4,4.4\n5,2.7\n6,2.5\n7,3.6\n8,5.3\n9,6.0\n10,5.9',
 txt:'A = ∫₁¹⁰ y(x) dx con coordenadas digitalizadas de la figura (aproximadas; editables)',v:[{n:'Área',u:'u²',p:I=>[[I,'u²']]}]},
22:{t:'Cable suspendido · longitud de la catenaria',kind:'func',f:'sqrt(1+sinh(x/24)^2)',a:-12,b:26,n:8,vr:'x',ref:24*(Math.sinh(26/24)-Math.sinh(-12/24)),
 txt:'y = a·cosh(x/a), a = 24 ft; L = ∫ √(1+y′²) dx, x∈[−12, 26] ft (valores de la figura)',v:[{n:'Longitud',u:'ft',p:I=>[[I,'ft'],[I*0.3048,'m']]}]},
23:{t:'Red de agua · caudal en tubería circular',kind:'func',f:'2*PI*x*80*(1-x/0.25)^(1/7)',a:0,b:0.25,n:8,vr:'r',ref:49*PI/12,
 txt:'Q = ∫₀ᴿ 2π r v(r) dr, v = 80(1 − r/R)^(1/7), R = 0,25 in, v_max = 80 in/s',v:[{n:'Caudal',u:'in³/s',p:I=>[[I,'in³/s'],[I*0.016387064,'L/s']]}]},
24:{t:'Trayectoria · longitud de la cardioide',kind:'func',f:'sqrt((-10*sin(x)+10*sin(2*x))^2+(10*cos(x)-10*cos(2*x))^2)',a:0,b:2*PI,n:8,vr:'t',ref:80,
 txt:'x=2b·cos t − b·cos 2t, y=2b·sin t − b·sin 2t, b=5; L = ∫₀²π √(x′²+y′²) dt',v:[{n:'Longitud',u:'u',p:I=>[[I,'u']]}]},
25:{t:'Energía gravitatoria · ΔU de un satélite',kind:'func',f:'500*9.81*6371000^2/(6371000+x)^2',a:0,b:800000,n:8,vr:'y',ref:500*g0*R*800000/(R+800000),
 txt:'ΔU = ∫₀ʰ m·g(y) dy, g = g₀R²/(R+y)², m=500 kg, h=800 km, R=6371 km (y en m)',v:[{n:'ΔU',u:'J',p:I=>[[I,'J'],[I/1e9,'GJ']]}]},
26:{t:'Superficie de lago · área del lago Erie',kind:'table',x:'x (mi)',y:'ancho w (mi)',d:'40,24\n60,40\n80,50\n100,56\n120,58\n140,56\n160,54\n180,50\n200,46\n220,40\n240,30\n260,9',ref:9940,
 txt:'A = ∫₄₀²⁶⁰ w(x) dx. Anchuras ESTIMADAS a ojo del mapa (editables); referencia real 9 940 mi²',v:[{n:'Área',u:'mi²',p:I=>[[I,'mi²'],[I*2.589988,'km²']]}]},
27:{t:'Objeto alargado · volumen y superficie del balón',kind:'table',x:'z (in)',y:'d (in)',d:'0,0\n1,2.6\n2,3.2\n3,4.8\n4,5.6\n5,6.0\n6,6.2\n7,6.0\n8,5.6\n9,4.8\n10,3.3\n11,2.6\n12,0',
 txt:'V = π∫ r² dz y S = 2π∫ r dz (fórmula del enunciado), r = d/2. Se añade S = 2π∫ r√(1+r′²) dz con r′ por diferencias finitas',
 v:[{n:'Volumen π∫r²dz',u:'in³',t:(x,d)=>d.map(q=>PI*(q/2)**2),p:I=>[[I,'in³']]},
    {n:'Superficie 2π∫r dz (enunciado)',u:'in²',t:(x,d)=>d.map(q=>2*PI*q/2),p:I=>[[I,'in²']]},
    {n:'Superficie de revolución 2π∫r√(1+r′²)dz',u:'in²',t:(x,d,h)=>{const r=d.map(q=>q/2),p=ddx(r,h);return r.map((q,i)=>2*PI*q*Math.sqrt(1+p[i]**2));},p:I=>[[I,'in²']]}]}
};
const M={s13t:'Simpson 1/3 + trapecio final (n impar)',trap:'Trapecio compuesto',s13:'Simpson 1/3',s38:'Simpson 3/8',comb:'Simpson combinado'};
EX.L={t:'Calculadora libre · tus propios datos',kind:'table',x:'x',y:'y',d:'0,0\n0.5,0.25\n1,1\n1.5,2.25\n2,4',txt:'Prueba de validación: f(x)=x² en [0,2] → 8/3 = 2,666667. Cambia a modo función con el botón de abajo.',ref:8/3,v:[{n:'Integral',u:'u',p:I=>[[I,'u']]}]};
if(typeof module!=='undefined')module.exports={EX,mkFn,integrate,parseTable,coefs,M};

const $=id=>document.getElementById(id);let cur='19',mode='table';
const fmt=(v,d=6)=>Number.isFinite(v)?(Math.abs(v)>=1e7||(Math.abs(v)<1e-4&&v!==0)?v.toExponential(8):v.toFixed(d)):'—';
function tabs(){$('tabs').innerHTML=Object.keys(EX).map(k=>`<button class="${k===cur?'on':''}" data-k="${k}">${k==='L'?'Libre':'Ej. '+k}</button>`).join('');
 $('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{cur=b.dataset.k;load()});}
function inputs(){const e=EX[cur];if(mode==='table')$('inp').innerHTML=`<div class="mu">Pares <b>${e.x||'x'}, ${e.y||'y'}</b> (uno por línea, separados por coma; x equiespaciado y creciente)</div><textarea id="data" spellcheck="false">${e.d||'0,0\n1,1'}</textarea>`;
 else{const f=e.f||'x^2';$('inp').innerHTML=`<div class="row"><label style="flex:1;min-width:240px">f(${e.vr||'x'}) — usa x como variable; sin, cos, sqrt, PI, ^ …<input id="f" value="${f}"></label><label>a<input id="a" size="10" value="${e.a??0}"></label><label>b<input id="b" size="10" value="${e.b??2}"></label><label>n<input id="n" size="5" value="${e.n??4}"></label></div>`;}
 $('vl').style.display=e.v.length>1&&mode==='table'?'':'none';}
function load(){const e=EX[cur];mode=e.kind;tabs();$('ttl').textContent=cur==='L'?e.t:'Ejercicio '+cur+' · '+e.t;$('txt').textContent=e.txt;
 $('var').innerHTML=e.v.map((v,i)=>`<option value="${i}">${v.n}</option>`).join('');$('ref').value=e.ref!==undefined?e.ref:'';
 $('met').value=mode==='func'?'s13':'comb';inputs();if(cur==='L'){const b=document.createElement('button');b.className='btn g';b.textContent='Cambiar a modo función/tabla';b.style.marginTop='8px';b.onclick=()=>{mode=mode==='table'?'func':'table';inputs();$('inp').appendChild(b)};$('inp').appendChild(b);}
 $('out').innerHTML='';$('msg').textContent='';run();}
function getNodes(){const e=EX[cur];let xs,ys,h;
 if(mode==='table'){({xs,ys,h}=parseTable($('data').value));}
 else{const a=+$('a').value,b=+$('b').value,n=Math.round(+$('n').value);if(![a,b].every(isFinite)||!isFinite(n))throw new Error('a, b y n deben ser numéricos.');if(!(b>a))throw new Error('Se requiere b > a.');if(n<1)throw new Error('n debe ser un entero ≥ 1.');
  let f;try{f=mkFn($('f').value)}catch(_){throw new Error('Expresión f(x) inválida.')}
  h=(b-a)/n;xs=[...Array(n+1)].map((_,i)=>a+i*h);ys=xs.map(x=>f(x,x,x,x));if(ys.some(v=>!isFinite(v)))throw new Error('f(x) no es finita en algún nodo.');}
 return {xs,ys,h};}
function run(){const e=EX[cur];$('msg').className='';$('msg').textContent='';
 try{const {xs,ys,h}=getNodes(),n=xs.length-1,vi=+$('var').value||0,v=e.v[vi]||e.v[0];const Y=v.t?v.t(xs,ys,h):ys;
  const m=$('met').value,I=integrate(Y,h,m);
  if(I===null)throw new Error('n = '+n+' no es compatible con «'+M[m]+'»'+(m==='s13'?' (n debe ser par)':m==='s38'?' (n debe ser múltiplo de 3)':m==='s13t'?' (requiere n impar ≥ 3)':' (requiere n ≥ 2)')+'. Prueba «Simpson combinado» u otro n.');
  const ref=parseFloat(String($('ref').value).replace(',','.'));const hasRef=isFinite(ref)&&ref!==0,c=coefs(m,n);
  const all=Object.keys(M).map(k=>({k,I:integrate(Y,h,k)}));
  let H=`<div class="card"><div class="mu">${M[m]} · n = ${n} · h = ${fmt(h)}</div><div class="big">${fmt(I)} <span style="font-size:15px">${v.u}</span></div><div class="sc"><table><tr>${v.p(I).map(q=>`<td style="text-align:left"><b>${fmt(q[0])}</b> ${q[1]}</td>`).join('')}</tr></table></div>`;
  if(hasRef)H+=`<div class="mu" style="margin-top:6px">Referencia ${fmt(ref)} · Error absoluto <b>${fmt(Math.abs(ref-I))}</b> · Error % <b>${fmt(100*Math.abs(ref-I)/Math.abs(ref),4)} %</b></div>`;else H+=`<div class="mu" style="margin-top:6px">Sin valor de referencia: no se calcula el error verdadero.</div>`;
  H+='</div><div class="g2"><div class="card"><h2>Comparación de métodos</h2><div class="sc"><table><tr><th>Método</th><th>Resultado</th>'+(hasRef?'<th>Error %</th>':'')+'</tr>'+all.map(r=>`<tr><td>${M[r.k]}</td><td>${r.I===null?'n/a':fmt(r.I)}</td>${hasRef?`<td>${r.I===null?'—':fmt(100*Math.abs(ref-r.I)/Math.abs(ref),4)}</td>`:''}</tr>`).join('')+'</table></div></div>';
  H+='<div class="card"><h2>Gráfico</h2>'+chart(xs,ys,Y,v.t?false:true)+'</div></div>';
  if(mode==='func'){const rows=[4,8,16,n].filter((q,i,a)=>a.indexOf(q)===i).sort((a,b)=>a-b).map(q=>{const hh=(+$('b').value-+$('a').value)/q,f=mkFn($('f').value),yy=[...Array(q+1)].map((_,i)=>{const x=+$('a').value+i*hh;return f(x,x,x,x)});const t=integrate(yy,hh,'trap'),s=integrate(yy,hh,'s13'),s3=integrate(yy,hh,'s38');return `<tr><td>${q}</td><td>${fmt(t)}</td><td>${s===null?'n/a':fmt(s)}</td><td>${s3===null?'n/a':fmt(s3)}</td></tr>`}).join('');
   H+=`<div class="card"><h2>Convergencia al aumentar n</h2><div class="sc"><table><tr><th>n</th><th>Trapecio</th><th>Simpson 1/3</th><th>Simpson 3/8</th></tr>${rows}</table></div></div>`;}
  H+='<div class="card"><h2>Tabla de nodos y pesos ('+M[m]+')</h2><div class="sc"><table><tr><th>i</th><th>x</th><th>f(x)</th><th>peso (×h)</th><th>contribución</th></tr>'+xs.map((x,i)=>`<tr><td>${i}</td><td>${fmt(x)}</td><td>${fmt(Y[i])}</td><td>${fmt(c[i],4)}</td><td>${fmt(c[i]*Y[i]*h)}</td></tr>`).join('')+`</table></div><div class="mu">I = h · Σ peso·f = ${fmt(I)}</div></div>`;
  $('out').innerHTML=H;}catch(er){$('out').innerHTML='';$('msg').className='err';$('msg').textContent='⚠ '+er.message;}}
function chart(xs,ys,Y,raw){const W=520,Ht=260,p=34,x0=xs[0],x1=xs[xs.length-1];let pts=xs.map((x,i)=>[x,Y[i]]);
 if(mode==='func'){try{const f=mkFn($('f').value);pts=[...Array(161)].map((_,i)=>{const x=x0+(x1-x0)*i/160;return[x,f(x,x,x,x)]});}catch(_){}}
 const yl=Math.min(0,...pts.map(q=>q[1])),yh=Math.max(...pts.map(q=>q[1]));const sx=x=>p+(x-x0)/(x1-x0||1)*(W-2*p),sy=y=>Ht-p-(y-yl)/((yh-yl)||1)*(Ht-2*p);
 const line=pts.map(q=>sx(q[0]).toFixed(1)+','+sy(q[1]).toFixed(1)).join(' ');const area=sx(x0)+','+sy(0)+' '+line+' '+sx(x1)+','+sy(0);
 const dots=xs.map((x,i)=>`<circle cx="${sx(x)}" cy="${sy(Y[i])}" r="3.5" fill="var(--ac)"/>`).join('');
 return `<svg viewBox="0 0 ${W} ${Ht}" role="img" aria-label="Área bajo la curva"><line x1="${p}" y1="${sy(0)}" x2="${W-p}" y2="${sy(0)}" stroke="var(--mu)"/><line x1="${p}" y1="${p-10}" x2="${p}" y2="${Ht-p}" stroke="var(--mu)"/><polygon points="${area}" fill="var(--ac2)" opacity=".25"/><polyline points="${line}" fill="none" stroke="var(--ac2)" stroke-width="2"/>${dots}<text x="${p}" y="${Ht-10}" font-size="11" fill="var(--mu)">${fmt(x0,3)}</text><text x="${W-p}" y="${Ht-10}" font-size="11" fill="var(--mu)" text-anchor="end">${fmt(x1,3)}</text><text x="${p-4}" y="${p-12}" font-size="11" fill="var(--mu)" text-anchor="end">${fmt(yh,3)}</text></svg>`;}
function test(){cur='L';load();mode='func';inputs();$('f').value='x^2';$('a').value=0;$('b').value=2;$('n').value=4;$('met').value='s13';$('ref').value=8/3;run();
 const f=mkFn('x^2'),r=n=>{const h=2/n,y=[...Array(n+1)].map((_,i)=>f(i*h));return[integrate(y,h,'trap'),integrate(y,h,'s13')]};const a=r(4),b=r(8);
 $('msg').className='ok';$('msg').textContent=`✔ x² en [0,2] (exacto 8/3 = 2,666667). n=4 → trapecio ${fmt(a[0])}, Simpson ${fmt(a[1])}. n=8 → trapecio ${fmt(b[0])}, Simpson ${fmt(b[1])}.`;}
$('go').onclick=run;$('tst').onclick=test;$('met').onchange=run;$('var').onchange=run;load();
</script></body></html>
